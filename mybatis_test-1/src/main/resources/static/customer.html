<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>顧客登録・検索</title>
</head>
<body>
    <h1>顧客登録</h1>
    <form id="registerForm">
        名前: <input type="text" id="name"><br>
        メール: <input type="email" id="email"><br>
        電話番号: <input type="text" id="phone"><br>
        住所: <input type="text" id="address"><br>
        <button type="submit">登録</button>
    </form>

    <h2>顧客検索</h2>
    名前で検索: <input type="text" id="searchName">
    <button onclick="searchCustomer()">検索</button>

    <h3>検索結果</h3>
    <ul id="resultList"></ul>

    <script>
        const API_BASE = "http://localhost:8080/api/customers";

        // 顧客登録
        document.getElementById("registerForm").addEventListener("submit", function(e) {
            e.preventDefault();

            const customer = {
                name: document.getElementById("name").value,
                email: document.getElementById("email").value,
                phone: document.getElementById("phone").value,
                address: document.getElementById("address").value
            };

            fetch(API_BASE, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(customer)
            }).then(response => {
                if (response.ok) {
                    alert("登録成功！");
                } else {
                    alert("登録失敗");
                }
            });
        });

        // 顧客検索
        function searchCustomer() {
            const name = document.getElementById("searchName").value;

            fetch(`${API_BASE}/search?name=${encodeURIComponent(name)}`)
                .then(response => response.json())
                .then(data => {
                    const list = document.getElementById("resultList");
                    list.innerHTML = "";
                    data.forEach(c => {
                        const li = document.createElement("li");
                        li.textContent = `${c.name}（${c.email} / ${c.phone} / ${c.address}）`;
                        list.appendChild(li);
                    });
                });
        }
    </script>
</body>
</html>
