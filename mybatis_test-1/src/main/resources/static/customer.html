    <!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>勤怠アプリDB接続テスト</title>
</head>
<body>
    <h1>勤怠アプリDB接続テスト</h1>
    
    <button onclick="testConnection()">基本接続確認</button>
    <button onclick="getTables()">テーブル一覧</button>
    <button onclick="getUserStructure()">usersテーブル構造</button>
    <button onclick="getSampleUsers()">サンプルユーザー</button>

    <h3>テスト結果</h3>
    <div id="result"></div>

    <script>
        const API_BASE = "http://localhost:8081/api/test";

        function testConnection() {
            console.log("接続テスト開始...");
            
            fetch(`${API_BASE}/connection`)
                .then(response => {
                    console.log("Response status:", response.status);
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    return response.json();
                })
                .then(data => {
                    console.log("成功:", data);
                    displayResult("基本接続確認", data);
                })
                .catch(error => {
                    console.error("エラー:", error);
                    displayResult("基本接続確認", { 
                        success: false, 
                        error: error.message,
                        message: "JavaScript fetch エラー"
                    });
                });
        }

        function getTables() {
            console.log("テーブル一覧取得開始...");
            
            fetch(`${API_BASE}/tables`)
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    return response.json();
                })
                .then(data => {
                    console.log("テーブル一覧:", data);
                    displayResult("テーブル一覧", data);
                })
                .catch(error => {
                    console.error("テーブル一覧エラー:", error);
                    displayResult("テーブル一覧", { success: false, error: error.message });
                });
        }

        function getUserStructure() {
            fetch(`${API_BASE}/users/structure`)
                .then(response => response.json())
                .then(data => {
                    displayResult("usersテーブル構造", data);
                })
                .catch(error => {
                    displayResult("usersテーブル構造", { success: false, error: error.message });
                });
        }

        function getSampleUsers() {
            fetch(`${API_BASE}/users/sample`)
                .then(response => response.json())
                .then(data => {
                    displayResult("サンプルユーザー", data);
                })
                .catch(error => {
                    displayResult("サンプルユーザー", { success: false, error: error.message });
                });
        }

        function displayResult(testName, data) {
            const resultDiv = document.getElementById("result");
            const testResult = document.createElement("div");
            testResult.innerHTML = `
                <h4>${testName}</h4>
                <pre style="background: #f0f0f0; padding: 10px; border-radius: 5px;">${JSON.stringify(data, null, 2)}</pre>
                <hr>
            `;
            resultDiv.appendChild(testResult);
        }

        // ページ読み込み時に自動テスト
        window.onload = function() {
            console.log("ページ読み込み完了。APIベースURL:", API_BASE);
        };
    </script>
</body>
</html>
